<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Reels Studio Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cinzel:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@300;400;500;600;700;800&family=Almarai:wght@300;400;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Katibeh&family=Lateef:wght@200;300;400;500;600;700;800&family=Ruwudu:wght@400;500;600;700&family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--s1:#111118;--s2:#1a1a24;--s3:#222230;--bd:#2a2a3a;--gd:#c9a96e;--gd2:#b8944f;--gd3:#a07838;--em:#22c55e;--em2:#16a34a;--tx:#f0f0f0;--td:#8888a0;--tm:#555570;--r:10px;--rs:6px;--tr:.2s}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;overflow:hidden;height:100dvh;user-select:none}
::selection{background:var(--gd);color:#0a0a0f}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}
.v{display:none;width:100%;height:100dvh}.v.a{display:flex}
#vh{flex-direction:column;overflow-y:auto}
.hdr{padding:20px 28px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--s2)}
.hdr h1{font-family:'Cinzel',serif;font-size:20px;font-weight:600;color:var(--gd);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.hdr h1 .lg{width:6px;height:18px;background:var(--gd);border-radius:2px;display:inline-block}
.hdr h1 sp{color:var(--tx);font-weight:300}
.srch{position:relative;width:260px}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--td);pointer-events:none}
.srch input{width:100%;padding:7px 10px 7px 28px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:12px;outline:none;font-family:inherit;transition:var(--tr)}
.srch input:focus{border-color:var(--gd);box-shadow:0 0 0 2px rgba(201,169,110,.1)}
.sec{padding:0 28px;margin-top:14px}
.sec h2{font-family:'Cinzel',serif;font-size:12px;color:var(--gd);margin-bottom:8px;font-weight:500;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.sec h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.pop{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.pop::-webkit-scrollbar{height:2px}
.pc{flex-shrink:0;background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--bd);border-radius:var(--rs);padding:8px 14px;cursor:pointer;transition:var(--tr);white-space:nowrap}
.pc:hover{border-color:var(--gd);background:linear-gradient(135deg,var(--s2),var(--s3));transform:translateY(-1px)}
.pc .ar{font-family:'Scheherazade New',serif;font-size:15px;color:var(--gd);line-height:1.3}
.pc .en{font-size:10px;color:var(--td);margin-top:1px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:5px;padding:6px 28px 40px;margin-top:4px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;cursor:pointer;transition:var(--tr);display:flex;justify-content:space-between;align-items:center}
.sc:hover{border-color:var(--gd);background:var(--s2);transform:translateY(-1px)}
.sc .ar{font-family:'Scheherazade New',serif;font-size:17px;color:var(--gd)}
.sc .en{font-size:11px;color:var(--tx);margin-top:1px}
.sc .ct{font-size:9px;color:var(--td);background:var(--s2);padding:2px 8px;border-radius:10px}
#vv{flex-direction:column}
.vh{padding:10px 28px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--s2);flex-shrink:0;flex-wrap:wrap}
.vh .bk{background:none;border:none;color:var(--td);cursor:pointer;font-size:18px;padding:3px 8px;border-radius:6px;font-family:inherit;transition:var(--tr)}
.vh .bk:hover{color:var(--tx);background:var(--s2)}
.vh .vi{flex:1;min-width:0}
.vh .vi .ar{font-family:'Scheherazade New',serif;font-size:20px;color:var(--gd)}
.vh .vi .en{font-size:11px;color:var(--td);text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.va{display:flex;gap:4px;flex-wrap:wrap}
.va button{padding:5px 12px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--s1);color:var(--tx);cursor:pointer;font-size:10px;font-family:inherit;transition:var(--tr)}
.va button:hover{border-color:var(--gd)}
.va .st{background:var(--gd);color:#0a0a0f;border-color:var(--gd);font-weight:600;opacity:.3;pointer-events:none}
.va .st.a{opacity:1;pointer-events:auto}
.va .st.a:hover{background:var(--gd2)}
.va .s2{border-color:var(--gd);color:var(--gd)}
.vl{flex:1;overflow-y:auto;padding:6px 28px 28px}
.vi2{display:flex;align-items:flex-start;gap:10px;padding:6px 10px;border-radius:var(--rs);border:1px solid transparent;transition:.12s;cursor:pointer}
.vi2:hover{background:var(--s1);border-color:var(--bd)}
.vi2.sel{background:rgba(201,169,110,.05);border-color:rgba(201,169,110,.15)}
.ck{width:16px;height:16px;border:2px solid var(--bd);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px;transition:.12s;font-size:9px;font-weight:700;color:transparent;font-family:inherit}
.ck.c{background:var(--gd);border-color:var(--gd);color:#0a0a0f}
.vn{width:22px;height:22px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--td);flex-shrink:0;margin-top:3px}
.vt{flex:1}
.vt .ar{font-family:'Scheherazade New',serif;font-size:16px;color:var(--tx);line-height:1.5;direction:rtl;word-break:break-word;margin-bottom:2px}
.vt .en{font-size:10px;color:var(--td);padding-left:6px;border-left:2px solid var(--gd);line-height:1.4}
#vs{height:100dvh}
.sl{display:flex;width:100%;height:100%}
.sp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050508;position:relative;min-width:0}
.cw{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:10px}
.cw canvas{max-width:100%;max-height:100%;border-radius:var(--r);box-shadow:0 20px 60px -16px rgba(0,0,0,.9);background:#000}
.pb{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;z-index:10}
.pb button{padding:7px 16px;border-radius:50px;border:none;font-weight:600;font-size:10px;cursor:pointer;font-family:inherit;transition:var(--tr);display:flex;align-items:center;gap:4px}
.pb button:active{transform:scale(.95)}
.pp{background:var(--gd);color:#0a0a0f}
.pp:hover{background:var(--gd2)}
.pp:disabled{opacity:.4;cursor:not-allowed}
.pn{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--s2);color:var(--td);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:var(--tr)}
.pn:hover{background:var(--s1);color:var(--tx)}
.pe{background:var(--em);color:#0a0a0f}
.pe:hover{background:var(--em2)}
.pe:disabled{opacity:.4;cursor:not-allowed}
.sc2{width:370px;min-width:370px;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.ch{padding:10px 14px;border-bottom:1px solid var(--s2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ch h3{font-family:'Cinzel',serif;font-size:13px;color:var(--gd);font-weight:500}
.ch .bk{background:none;border:none;color:var(--td);cursor:pointer;font-size:10px;padding:3px 6px;border-radius:6px;font-family:inherit;transition:var(--tr)}
.ch .bk:hover{color:var(--tx);background:var(--s2)}
.sib{padding:6px 14px;border-bottom:1px solid var(--s2);flex-shrink:0}
.sib p{font-size:9px;color:var(--td)}
.sib h2{font-size:13px;color:var(--tx);font-weight:400;margin:1px 0}
.sib .mt{font-size:9px;color:var(--td)}
.cb{flex:1;overflow-y:auto;padding:10px 14px;scrollbar-gutter:stable}
.cb::-webkit-scrollbar{width:2px}
.cg{margin-bottom:10px}
.cg>label{display:block;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--td);margin-bottom:3px}
.cg select,.cg input{padding:5px 7px;border-radius:4px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:10px;outline:none;font-family:inherit;width:100%;transition:var(--tr)}
.cg select:focus,.cg input:focus{border-color:var(--gd)}
.cg select option{background:var(--s1);color:var(--tx)}
.fp{display:flex;gap:3px}
.fb{flex:1;padding:5px 0;text-align:center;border:1px solid var(--bd);border-radius:4px;background:var(--s2);color:var(--td);cursor:pointer;font-size:9px;font-weight:600;font-family:inherit;transition:var(--tr)}
.fb:hover{border-color:var(--tm)}
.fb.on{border-color:var(--gd);color:var(--gd);background:rgba(201,169,110,.1)}
.rg{display:flex;align-items:center;gap:6px}
.rg input[type=range]{flex:1;-webkit-appearance:none;height:2px;border-radius:2px;background:var(--bd);outline:none;transition:var(--tr)}
.rg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--gd);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--gd)}
.rg input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.rg .rv{font-size:10px;color:var(--td);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.tg{position:relative;width:30px;height:16px;flex-shrink:0}
.tg input{display:none}
.tg .sl{position:absolute;inset:0;background:var(--bd);border-radius:8px;cursor:pointer;transition:var(--tr)}
.tg .sl::before{content:'';position:absolute;width:12px;height:12px;left:2px;bottom:2px;background:var(--tx);border-radius:50%;transition:var(--tr)}
.tg input:checked+.sl{background:var(--em)}
.tg input:checked+.sl::before{transform:translateX(14px)}
.tr2{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}.tr2>label{margin:0}
.cl{display:flex;align-items:center;gap:4px}
.cl input[type=color]{width:24px;height:24px;border:1px solid var(--bd);border-radius:3px;background:none;cursor:pointer;padding:1px;flex-shrink:0}
.cl input[type=text]{flex:1}
.bgt{display:flex;gap:2px;margin-bottom:4px}
.bgb{flex:1;padding:3px 0;text-align:center;border:none;border-radius:3px;background:var(--s2);color:var(--td);cursor:pointer;font-size:8px;font-weight:600;font-family:inherit;transition:.12s}
.bgb.on{background:var(--gd);color:#0a0a0f}
.bgp{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-height:160px;overflow-y:auto}
.bgi{aspect-ratio:16/9;border-radius:3px;border:2px solid transparent;cursor:pointer;transition:var(--tr)}
.bgi:hover{border-color:var(--tm);transform:scale(1.03)}.bgi.on{border-color:var(--gd);box-shadow:0 0 8px rgba(201,169,110,.2)}
.bgv{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;max-height:180px;overflow-y:auto}
.bgv .bp{aspect-ratio:16/9;border-radius:4px;border:2px solid transparent;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.bgv .bp:hover{border-color:var(--gd);transform:scale(1.02)}.bgv .bp.on{border-color:var(--gd);box-shadow:0 0 8px rgba(201,169,110,.2)}
.bgv .bp span{font-size:8px;color:rgba(255,255,255,.6);text-align:center;padding:4px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.6);font-weight:500;position:relative;z-index:2;pointer-events:none}
.bgv .bp .bp-bg{position:absolute;inset:0;z-index:0}
.bgv .bp .bp-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none}
.bgv .bp.on .bp-img{opacity:.8}
.bgv .bp.on span{color:#fff;text-shadow:0 0 8px rgba(0,0,0,.9)}
.bgv .bp{position:relative}
.exo{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:12px;backdrop-filter:blur(8px)}
.exo.on{display:flex}
.exo .spin{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--gd);border-radius:50%;animation:sp .8s linear infinite}
.exo p{color:var(--td);font-size:12px;text-align:center;max-width:320px;line-height:1.4}
.exp-bar{width:260px;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.exp-bar-inner{height:100%;background:linear-gradient(90deg,var(--gd),var(--gd2));border-radius:2px;width:0%;transition:width .3s}
.exo .cnl{padding:6px 18px;border-radius:50px;border:1px solid var(--bd);background:transparent;color:var(--td);cursor:pointer;font-size:10px;font-family:inherit;transition:var(--tr)}
.exo .cnl:hover{background:rgba(255,255,255,.05);color:var(--tx);border-color:var(--tm)}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fl{0%{opacity:0}100%{opacity:1}}
@media(max-width:900px){
  .sc2{width:100%;min-width:0}.sl{flex-direction:column}
  .hdr{padding:14px 16px;flex-direction:column;align-items:stretch}.srch{width:100%}
  .sg{padding:6px 16px 20px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .vh{padding:8px 16px;flex-wrap:wrap}
  .vl{padding:6px 16px}.sec{padding:0 16px}
  .pb{bottom:8px;flex-wrap:wrap;justify-content:center}
  .ch{padding:8px 12px}
  .cb{padding:8px 12px}
}
@media(max-width:480px){
  .sg{grid-template-columns:1fr}
  .hdr h1{font-size:16px}
}
</style>
</head>
<body>
<div id="vh" class="v a">
  <div class="hdr">
    <h1><span class="lg"></span>Quran <sp>Reels</sp></h1>
    <div class="srch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="srch" placeholder="Search surah..." oninput="renderHome()">
    </div>
  </div>
  <div class="sec">
    <h2>Popular</h2>
    <div class="pop" id="pop"></div>
  </div>
  <div class="sg" id="sg"></div>
</div>
<div id="vv" class="v">
  <div class="vh">
    <button class="bk" onclick="showView('vh')">&larr;</button>
    <div class="vi">
      <div class="ar" id="vsar"></div>
      <div class="en" id="vsen"></div>
    </div>
    <div class="va">
      <button onclick="toggleAll()" id="selAllBtn">Select All</button>
      <button class="st" id="stBtn" onclick="goStudio()">Studio &rarr;</button>
    </div>
  </div>
  <div class="vl" id="vl"></div>
</div>
<div id="vs" class="v">
  <div class="sl">
    <div class="sp">
      <div class="cw"><canvas id="cv"></canvas></div>
      <div class="pb">
        <button class="pn" onclick="prv()">&#9664;</button>
        <button class="pp" id="ppBtn" onclick="tp()">&#9654; Preview</button>
        <span id="vcnt" style="font-size:9px;color:var(--td);font-family:inherit;min-width:32px;text-align:center;font-variant-numeric:tabular-nums">0 / 0</span>
        <button class="pe" id="peBtn" onclick="doExport()">Export</button>
        <button class="pn" onclick="nxt()">&#9654;</button>
      </div>
    </div>
    <div class="sc2">
      <div class="ch">
        <h3>Studio Controls</h3>
        <button class="bk" onclick="showView('vv')">&larr; Back</button>
      </div>
      <div class="sib" id="sib"></div>
      <div class="cb" id="cbody"></div>
    </div>
  </div>
</div>
<div class="exo" id="exo">
  <div class="spin"></div>
  <p id="expT">Preparing...</p>
  <div class="exp-bar"><div class="exp-bar-inner" id="expb"></div></div>
  <p id="expP" style="font-size:10px;color:var(--tm)">Starting...</p>
  <button class="cnl" id="cnlBtn" onclick="cancelExport()">Cancel</button>
</div>
<script>

// ═══ THUMBNAIL CAPTURE SYSTEM ═══════════════════
const THUMB_CACHE={};
let _thumbQueue=[],_thumbRunning=false;
function queueThumbCapture(urls,batchSize=4,callback){
  let idx=0;
  _thumbQueue=urls.map(u=>({u,i:idx++}));
  if(!_thumbRunning){_thumbRunning=true;processThumbBatch(batchSize,callback);}
}
async function processThumbBatch(batchSize,callback){
  const batch=_thumbQueue.splice(0,batchSize);
  if(!batch.length){_thumbRunning=false;return;}
  await Promise.all(batch.map(({u,i})=>captureVideoFrame(u).then(t=>{if(t&&callback)callback(i,t);})));
  setTimeout(()=>processThumbBatch(batchSize,callback),100);
}
function captureVideoFrame(url){
  return new Promise(resolve=>{
    if(THUMB_CACHE[url]){resolve(THUMB_CACHE[url]);return;}
    const v=document.createElement('video');
    v.crossOrigin='anonymous';v.muted=true;v.playsInline=true;v.preload='metadata';
    v.onloadedmetadata=()=>{v.currentTime=Math.min(v.duration*0.15,1);};
    v.onseeked=()=>{
      const c=document.createElement('canvas'),w=160,h=90;
      c.width=w;c.height=h;const cx=c.getContext('2d');
      try{cx.drawImage(v,0,0,w,h);}catch(e){v.remove();resolve(null);return;}
      const d=c.toDataURL('image/jpeg',0.5);
      THUMB_CACHE[url]=d;v.remove();resolve(d);
    };
    v.onerror=()=>{v.remove();resolve(null);};
    v.src=url;v.load();
  });
}

function resizeCV(){const f=FMTS[S.fmt]||FMTS['9:16'];CV.width=f.w;CV.height=f.h;CV.style.aspectRatio=`${f.w}/${f.h}`;}
function getVerseIdx(){const i=[...S.sel].sort((a,b)=>a-b);if(!i.length)return -1;return i[Math.min(S.vIdx,i.length-1)];}
function getVerseAt(idx){if(idx<0||idx>=S.va.length)return null;return{idx,ar:S.va[idx],en:S.ve[idx]};}
function draw(){
  const w=CV.width,h=CV.height;if(!w||!h)return;
  drawBg(w,h);
  CT.fillStyle=`rgba(0,0,0,${S.veil})`;CT.fillRect(0,0,w,h);
  const vi=getVerseIdx();const v=getVerseAt(vi);if(!v||!v.ar)return;
  drawVerseText(v.ar.text,v.en?.text||'',v.ar.numberInSurah,w,h,1,false);
  if(S.wm){drawWm(w,h);}
  // progress bar
  const pw=w*.65,ph=2,px=(w-pw)/2,py=h-20;
  CT.fillStyle='rgba(255,255,255,.06)';CT.beginPath();CT.roundRect(px,py,pw,ph,1);CT.fill();
  if(S.urls.length>0){CT.fillStyle=S.tc;const p=S.playing?Math.min((S.vIdx+0.5)/S.urls.length,1):S.vIdx/S.urls.length;CT.beginPath();CT.roundRect(px,py,pw*p,ph,1);CT.fill();}
}
function drawWm(w,h){
  if(!S.wm)return;
  CT.save();CT.font='500 11px "Inter",sans-serif';CT.textBaseline='middle';
  const txt=S.wm,mt=CT.measureText(txt).width,pad=10;
  let wx,wy;
  switch(S.wmPos){
    case'tl':wx=pad;wy=pad+8;break;
    case'tr':wx=w-pad-mt;wy=pad+8;CT.textAlign='right';break;
    case'bl':wx=pad;wy=h-pad-8;break;
    case'br':wx=w-pad-mt;wy=h-pad-8;CT.textAlign='right';break;
    case'c':wx=w/2;wy=h/2;CT.textAlign='center';break;
    default:wx=w-pad-mt;wy=h-pad-8;CT.textAlign='right';
  }
  CT.fillStyle='rgba(0,0,0,.4)';const bw=mt+16,bh=24;CT.beginPath();CT.roundRect(wx-8,wy-12,bw,bh,4);CT.fill();
  CT.fillStyle='rgba(255,255,255,.5)';CT.fillText(txt,wx,wy);
  CT.restore();
}
function drawVerseText(txt,tr,vn,w,h,alpha,fadeDir){
  const mw=w-(w*S.mrgn/100)*2;
  CT.save();CT.globalAlpha=alpha;
  // Verse number marker
  const mark=S.showNum?'\uFD3F\u200F'+vn+'\u200F\uFD3E':'';
  // Arabic
  CT.textAlign='center';CT.textBaseline='middle';CT.direction='rtl';
  CT.font=`${S.arWt} ${S.arSz}px "${S.arFn}","Amiri","Scheherazade New",serif`;
  const arTxt=txt+(mark?' '+mark:''),em=CT.measureText(mark||' ').width;
  const al=[];const lh=S.arSz*S.lh;
  let cl='';
  if(CT.measureText(arTxt).width>mw-em){
    for(const c of txt){const t=cl+c;if(CT.measureText(t).width>mw-em&&cl){al.push(cl);cl=c;}else cl=t;}
    if(cl)al.push(cl);if(mark)al[al.length-1]=al[al.length-1]+' '+mark;
  }else al.push(arTxt);
  // English
  let tl=[],tlh=0;
  if(S.trans&&tr){
    tlh=S.trSz*1.5;CT.textAlign='center';CT.textBaseline='middle';CT.direction='ltr';
    CT.font=`${S.trWt} ${S.trSz}px "${S.trFn}","Inter",sans-serif`;
    let l='';for(const w of tr.split(' ')){const t=l?l+' '+w:w;if(CT.measureText(t).width>mw&&l){tl.push(l);l=w;}else l=t;}if(l)tl.push(l);
  }
  const gap=S.trans&&tl.length?S.arSz*0.3+tlh:0;
  const th2=al.length*lh+gap+tl.length*tlh;
  // Vertical position
  const vp=S.vPos/100;
  const minAy=lh/2+10,maxAy=h-th2+lh/2-10;
  let ay=Math.max(minAy,Math.min(maxAy,h*vp-th2/2+lh/2));
  // Draw Arabic
  CT.textAlign='center';CT.textBaseline='middle';CT.direction='rtl';
  CT.font=`${S.arWt} ${S.arSz}px "${S.arFn}","Amiri","Scheherazade New",serif`;
  if(S.shad){CT.shadowColor=S.shadC;CT.shadowBlur=S.shadB;CT.shadowOffsetY=S.shadY;}
  CT.fillStyle=S.tc;
  al.forEach((l,i)=>{CT.fillText(l,w/2,ay+i*lh);});
  CT.shadowBlur=0;CT.shadowOffsetY=0;
  if(S.stroke){CT.strokeStyle=S.strokeC;CT.lineWidth=S.strokeW;al.forEach((l,i)=>{CT.strokeText(l,w/2,ay+i*lh);});}
  // Draw English
  if(S.trans&&tl.length){
    let ty=Math.min(ay+al.length*lh+gap+tlh/2,h-28);
    CT.globalAlpha=alpha*0.12;CT.fillStyle=S.tc;
    const lw=Math.min(w*.1,80);
    CT.beginPath();CT.roundRect(w/2-lw/2,ty-tlh*0.4,lw,1,0.5);CT.fill();
    CT.globalAlpha=alpha;CT.textAlign='center';CT.textBaseline='middle';CT.direction='ltr';
    CT.font=`${S.trWt} ${S.trSz}px "${S.trFn}","Inter",sans-serif`;
    if(S.shad){CT.shadowColor=S.shadC;CT.shadowBlur=S.shadB;CT.shadowOffsetY=S.shadY;}
    CT.fillStyle='#f0f0f0';
    tl.forEach((l,i)=>{CT.fillText((i===0?vn+'. ':'')+l,w/2,ty+i*tlh);});
    CT.shadowBlur=0;CT.shadowOffsetY=0;
  }
  CT.restore();
}
function drawBg(w,h){
  if(S._bgV&&S._bgV.readyState>=2){
    try{
      CT.save();
      if(S.bgZoom>0){const s=1+S.bgZoom*0.02;const cx=w/2,cy=h/2;CT.translate(cx,cy);CT.scale(s,s);CT.translate(-cx,-cy);}
      if(S.parallax){
        const px=Math.sin(S._bo*0.5)*w*0.02,py=Math.cos(S._bo*0.3)*h*0.015;
        CT.translate(px,py);
      }
      if(S.bgBlur>0)CT.filter=`blur(${S.bgBlur}px)`;
      CT.drawImage(S._bgV,0,0,w,h);
      CT.restore();
    }catch(e){CT.restore();}
    // Vignette
    if(S.vignette>0){const g=CT.createRadialGradient(w/2,h/2,w*0.3,w/2,h/2,w*0.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${S.vignette})`);CT.fillStyle=g;CT.fillRect(0,0,w,h);}
    // Color overlay
    if(S.colorOv){CT.fillStyle=S.colorOv;CT.globalAlpha=S.colorOvOp;CT.fillRect(0,0,w,h);CT.globalAlpha=1;}
    return;
  }
  if(S._bgImg){
    try{
      CT.save();
      if(S.bgZoom>0){const s=1+S.bgZoom*0.02;const cx=w/2,cy=h/2;CT.translate(cx,cy);CT.scale(s,s);CT.translate(-cx,-cy);}
      if(S.parallax){CT.translate(Math.sin(S._bo*0.5)*w*0.02,Math.cos(S._bo*0.3)*h*0.015);}
      if(S.bgBlur>0)CT.filter=`blur(${S.bgBlur}px)`;
      CT.drawImage(S._bgImg,0,0,w,h);
      CT.restore();
    }catch(e){CT.restore();}
    if(S.vignette>0){const g=CT.createRadialGradient(w/2,h/2,w*0.3,w/2,h/2,w*0.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${S.vignette})`);CT.fillStyle=g;CT.fillRect(0,0,w,h);}
    if(S.colorOv){CT.fillStyle=S.colorOv;CT.globalAlpha=S.colorOvOp;CT.fillRect(0,0,w,h);CT.globalAlpha=1;}
    return;
  }
  if(!S.bgP){CT.fillStyle='#0a0a0f';CT.fillRect(0,0,w,h);if(S.vignette>0){const g=CT.createRadialGradient(w/2,h/2,w*0.3,w/2,h/2,w*0.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${S.vignette})`);CT.fillStyle=g;CT.fillRect(0,0,w,h);}if(S.colorOv){CT.fillStyle=S.colorOv;CT.globalAlpha=S.colorOvOp;CT.fillRect(0,0,w,h);CT.globalAlpha=1;}return;}
  S._bo+=0.002*S.bgSpeed;
  const p=PRESETS.find(x=>x[0]===S.bgP)||PRESETS[0];
  const cs=p[1].split(','),cx=w/2,cy=h/2;
  const g=CT.createRadialGradient(cx+Math.sin(S._bo)*w*0.07,cy+Math.cos(S._bo*0.7)*h*0.05,0,cx,cy,Math.max(w,h)*.85);
  cs.forEach((c,i)=>g.addColorStop(i/(cs.length-1),c.trim()));
  CT.fillStyle=g;CT.fillRect(0,0,w,h);
  // Stars for dark presets
  const dark=['night','deep','silver','peace','bismark','royal','midnight','slate','plum'];
  if(dark.includes(p[0])||S.bgP.startsWith('night')||S.bgP.startsWith('deep')||S.bgP.startsWith('mid')){
    const sd=Math.sin(p[0].charCodeAt(0)*100)*10000;
    const n=Math.min(150,Math.max(50,w*h/8000));
    for(let i=0;i<n;i++){
      const sx=((i*173+Math.floor(sd)+i*i*3)%(w*1.2)-w*0.1);
      const sy=((i*97+Math.floor(sd)*7+i*11)%(h*0.85));
      const sz=((i*7)%3)*0.25+0.1;
      const twinkle=0.5+0.5*Math.sin(S._bo*2+i);
      CT.globalAlpha=twinkle*(0.1+((i*37)%100)/350);
      CT.fillStyle='#fff';CT.beginPath();CT.arc(sx,sy,sz,0,Math.PI*2);CT.fill();
    }
    CT.globalAlpha=1;
  }
  // Vignette & color overlay for presets too
  if(S.vignette>0){const g=CT.createRadialGradient(w/2,h/2,w*0.3,w/2,h/2,w*0.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${S.vignette})`);CT.fillStyle=g;CT.fillRect(0,0,w,h);}
  if(S.colorOv){CT.fillStyle=S.colorOv;CT.globalAlpha=S.colorOvOp;CT.fillRect(0,0,w,h);CT.globalAlpha=1;}
}
function loop(){
  const needsDraw=S.playing||S.exporting||(S._bgV&&S._bgV.readyState>=2&&!S._bgV.paused);

function playV(idx){
  if(!S.playing)return;
  if(idx>=S.urls.length){S.playing=false;$('ppBtn').innerHTML='&#9654; Preview';if(!S._bgV)stopL();draw();return;}
  S.vIdx=idx;draw();$('vcnt').textContent=(idx+1)+' / '+S.urls.length;
  S._audio.src=S.urls[idx];S._audio.load();
  const go=()=>{S._audio.currentTime=0;S._audio.play().catch(()=>setTimeout(()=>playV(idx+1),100));};
  S._audio.onerror=()=>setTimeout(()=>playV(idx+1),100);
  S._audio.oncanplaythrough=()=>{go();S._audio.oncanplaythrough=null;};
  S._audio.onended=()=>{if(S.playing)setTimeout(()=>playV(idx+1),50);};
  setTimeout(()=>{if(S.playing&&S.vIdx===idx){go();S._audio.oncanplaythrough=null;}},2500);
}

// ═══ EXPORT ══════════════════════════════════════
window.cancelExport=()=>{S._cancel=true;};
window.doExport=async()=>{
  if(S.exporting||S.urls.length<1)return;
  S.exporting=true;S._cancel=false;S.playing=false;S._audio.pause();
  $('exo').classList.add('on');$('ppBtn').disabled=true;$('peBtn').disabled=true;$('cnlBtn').style.display='inline-block';
  const pbar=$('expb'),pt=$('expP'),tt=$('expT');
  const idx=[...S.sel].sort((a,b)=>a-b),total=idx.length;
  try{
    tt.textContent='Loading audio...';pt.textContent='0/'+total;pbar.style.width='3%';
    const actx=new AudioContext();S._expActx=actx;
    if(actx.state==='suspended')await actx.resume();
    const bufs=[];
    for(let i=0;i<total;i++){
      if(S._cancel){tt.textContent='Cancelled';pt.textContent='Export cancelled';await new Promise(r=>setTimeout(r,1000));throw new Error('cancelled');}
      try{
        const r=await fetch(S.urls[i]);if(!r.ok)throw new Error('HTTP'+r.status);
        const ab=await r.arrayBuffer();const buf=await actx.decodeAudioData(ab);bufs.push(buf);
      }catch(e){console.warn('audio fail',i,e);bufs.push(null);}
      pt.textContent=`Audio ${i+1}/${total}`;pbar.style.width=`${3+(i/total)*15}%`;
    }
    if(S._cancel)throw new Error('cancelled');
    tt.textContent='Recording...';pt.textContent='Rendering frames...';
    pbar.style.width='20%';
    const fade=S.fadeDur;
    const cum=[0];for(let i=0;i<total;i++)cum.push(cum[i]+(bufs[i]?.duration||2.5));
    const totalTime=cum[total]+1.5;
    const fps=S.fps;
    const vidStream=CV.captureStream(fps);
    const audDest=actx.createMediaStreamDestination();
    const mix=new MediaStream([...vidStream.getVideoTracks(),...audDest.stream.getAudioTracks()]);
    const mime='video/webm;codecs=vp9,opus';
    const mime2='video/webm;codecs=vp8,opus';
    const mime3='video/webm';
    const mt=MediaRecorder.isTypeSupported(mime)?mime:MediaRecorder.isTypeSupported(mime2)?mime2:mime3;
    const rec=new MediaRecorder(mix,{mimeType:mt});
    const chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    pt.textContent=`Recording ~${Math.round(totalTime)}s (${mt.includes('vp9')?'VP9':'VP8'}) ...`;
    rec.start();
    const baseTime=actx.currentTime+0.3;
    // Schedule all verses
    for(let i=0;i<total;i++){
      if(bufs[i]){
        const src=actx.createBufferSource();src.buffer=bufs[i];src.connect(audDest);src.start(baseTime+cum[i]);
      }
      // Transition
      if(i>0){
        const fStart=(cum[i]-fade)*1000;
        const vi=i;
        setTimeout(()=>{
          if(S._cancel)return;
          const st=performance.now(),dur=fade*1000;
          function fLoop(){
            if(S._cancel)return;
            const p=Math.min((performance.now()-st)/dur,1);
            const w=CV.width,h=CV.height;if(!w||!h)return;
            drawBg(w,h);
            CT.fillStyle=`rgba(0,0,0,${S.veil})`;CT.fillRect(0,0,w,h);
            // Zoom effect during transition
            if(S.transStyle==='zoom'){
              const s=1-p*0.03;CT.save();CT.translate(w/2,h/2);CT.scale(s,s);CT.translate(-w/2,-h/2);
            }
            // Crossfade
            const va=getVerseAt(idx[vi-1]),vb=getVerseAt(idx[vi]);
            if(va&&va.ar)drawVerseText(va.ar.text,va.en?.text||'',va.ar.numberInSurah,w,h,1-p,true);
            if(vb&&vb.ar)drawVerseText(vb.ar.text,vb.en?.text||'',vb.ar.numberInSurah,w,h,p,true);
            if(S.transStyle==='zoom')CT.restore();
            if(S.wm)drawWm(w,h);
            p<1?requestAnimationFrame(fLoop):draw();
          }
          fLoop();
        },Math.max(0,fStart));
      }
      // Status update at verse boundary
      setTimeout(()=>{S.vIdx=i;if(!S._cancel)draw();pt.textContent=`Verse ${i+1}/${total} @ ${Math.round(cum[i])}s`;pbar.style.width=`${20+((i+1)/total)*65}%`;},cum[i]*1000);
    }
    // Wait for completion
    await Promise.race([
      new Promise(r=>setTimeout(r,totalTime*1000+500)),
      new Promise(r=>{const iv=setInterval(()=>{if(S._cancel){clearInterval(iv);r();}},100);})
    ]);
    if(S._cancel)throw new Error('cancelled');
    rec.stop();actx.close();S._expActx=null;
    await new Promise(r=>setTimeout(r,500));
    pbar.style.width='92%';pt.textContent='Finalizing...';
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`quran-${S.surah?.[2]?.replace(/[^a-z]/gi,'-')||'recitation'}-${S.fmt}-${S.rec}.webm`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    pbar.style.width='100%';pt.textContent='Done! Downloading...';
    tt.textContent='Export Complete';
    await new Promise(r=>setTimeout(r,1500));
  }catch(e){
    if(e.message==='cancelled'){
      pt.textContent='Cancelled';tt.textContent='Export Cancelled';
      if(S._expActx)try{S._expActx.close();S._expActx=null;}catch(_){}
      await new Promise(r=>setTimeout(r,1000));
    }else{
      console.error('Export error:',e);
      pt.textContent='Error: '+e.message;tt.textContent='Export failed';
      await new Promise(r=>setTimeout(r,3000));
    }
  }
  S.exporting=false;S._cancel=false;$('exo').classList.remove('on');$('ppBtn').disabled=false;$('peBtn').disabled=false;$('cnlBtn').style.display='none';
  if(!S._bgV)stopL();draw();
};

window.handleUpload=input=>{

    vl.oncanplay=()=>{S._bgV=vl;vl.play().catch(()=>{});startL();draw();};
    vl.onerror=()=>{};
    vl.load();

    const img=new Image();img.onload=()=>{S._bgImg=img;if(S._bgV){S._bgV.pause();if(S._bgV.src)URL.revokeObjectURL(S._bgV.src);S._bgV=null;}S.bgP=null;draw();startL();};

// Video category keywords
const VID_CATS=[
  {k:'water ocean sea wave river lake shore coast beach stream pond rain waterfall bay',n:'Water'},
  {k:'sky cloud night star moonlight moon milky galaxy space nebula starfield',n:'Sky & Space'},
  {k:'forest tree leaf wood plant green grass meadow garden flower blossom cherry lavender wheat field pine',n:'Forest & Nature'},
  {k:'mountain peak hill valley snow peak alpine cliff canyon vista ridge',n:'Mountains'},
  {k:'desert sand dune sunset sunrise sun golden horizon dusk dawn',n:'Desert & Sun'},
  {k:'snow ice winter frost freeze frozen glacier cold',n:'Snow & Ice'},
  {k:'fire flame smoke glow candle light firefly',n:'Fire & Dramatic'},
  {k:'abstract pattern texture blur kaleidoscope',n:'Abstract'},
  {k:'aerial drone bird eye view fly over from above',n:'Aerial'},
  {k:'fog mist foggy haze',n:'Fog & Mist'},
];
function getVidCats(name){
  const n=name.toLowerCase();
  const cats=[];
  VID_CATS.forEach(c=>{if(c.k.split(' ').some(kw=>n.includes(kw)))cats.push(c.n);});
  return cats.length?cats:['Other'];
}
window.searchVid=()=>{
  const q=($('vq')?.value||'').toLowerCase();const g=$('vg');if(!g)return;
  const catFilter=$('vcat')?.value||'all';
  let m=q?VIDS.filter(v=>v.n.toLowerCase().includes(q)):VIDS;
  if(catFilter!=='all')m=m.filter(v=>getVidCats(v.n).includes(catFilter));
  g.innerHTML=m.map((v,i)=>{
    let h=0;for(let c=0;c<v.n.length;c++)h=(h*31+v.n.charCodeAt(c))%360;
    const c1=`hsl(${h},55%,18%)`,c2=`hsl(${(h+40)%360},50%,25%)`;
    const isOn=S.bgVidIdx===VIDS.indexOf(v);
    const thumb=THUMB_CACHE[v.u];
    return `<div class="bp${isOn?' on':''}" onclick="pickVid(${VIDS.indexOf(v)},this)" title="${v.n}"><div class="bp-bg" style="background:linear-gradient(135deg,${c1},${c2})"></div>${thumb?`<img class="bp-img" src="${thumb}" alt="${v.n}" loading="lazy">`:''}<span>${v.n}</span></div>`;
  }).join('');
  if(m.length>0&&S.bgVidIdx<0)pickVid(VIDS.indexOf(m[0]),g.querySelector('.bp'));
  // Start capturing thumbnails for visible videos
  if(m.length&&!Object.keys(THUMB_CACHE).length){
    queueThumbCapture(m.slice(0,30).map(v=>v.u),3,(idx,thumb)=>{
      const imgs=g.querySelectorAll('.bp-img');
      if(imgs[idx]&&thumb){imgs[idx].src=thumb;imgs[idx].style.display='block';}
    });
  }
};
window.pickVid=(idx,el)=>{
  document.querySelectorAll('.bp').forEach(b=>b.classList.remove('on'));if(el)el.classList.add('on');
  if(idx<0||idx>=VIDS.length)return;const v=VIDS[idx];S._bgImg=null;S.bgP=null;S.bgVidIdx=idx;
  if(S._bgV){S._bgV.pause();if(S._bgV.src)URL.revokeObjectURL(S._bgV.src);S._bgV=null;}
  const vl=document.createElement('video');
  vl.src=v.u;vl.loop=true;vl.muted=true;vl.playsInline=true;vl.crossOrigin='anonymous';vl.preload='auto';
  vl.oncanplay=()=>{S._bgV=vl;vl.playbackRate=S.bgVidSpd;vl.play().catch(()=>{});startL();draw();};
  vl.onerror=()=>{S._bgV=null;};
  vl.load();
};

// ═══ PEXELS LIVE SEARCH ══════════════════════════
const PEX_KEY='563492ad6f91700001000001f58512b27ee04f898e24172698be375f';
window.quickPex=(q)=>{const i=document.getElementById('pexQ');if(i){i.value=q;searchPexels();}};
window.searchPexels=async()=>{
  const q=document.getElementById('pexQ')?.value?.trim()||'nature';const g=document.getElementById('pexG');if(!g)return;
  g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--tm)"><div class="spin" style="margin:0 auto 12px;width:20px;height:20px"></div>Searching...</div>';
  try{
    const r=await fetch('https://api.pexels.com/videos/search?query='+encodeURIComponent(q)+'&per_page=30&orientation=portrait',{headers:{Authorization:PEX_KEY}});
    const d=await r.json();if(!d.videos||!d.videos.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--tm);font-size:9px">No results. Try a different search.</div>';return;}
    g.innerHTML=d.videos.map(v=>{
      const small=v.video_files?.filter(f=>f.width&&f.height&&parseInt(f.width)<=540)[0]||v.video_files?.[0];
      if(!small)return '';
      const thumb=v.video_pictures?.[0]?.picture||'';
      const name=v.url?.split('/')?.pop()?.replace(/-/g,' ')?.replace(/\//g,'')?.trim()||'Video';
      const url=small.link;
      return '<div class="bp" onclick="pickPex(\''+url+'\',this)" title="'+name+'"><div class="bp-bg" style="background:linear-gradient(135deg,#1a1a2e,#16213e)"></div>'+(thumb?'<img class="bp-img" src="'+thumb+'" style="display:block">':'')+'<span>'+name.substring(0,20)+'</span></div>';
    }).join('');
  }catch(e){
    g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--em2);font-size:9px">Search failed. Check connection.</div>';
  }
};
window.pickPex=(url,el)=>{
  document.querySelectorAll('#pexG .bp').forEach(b=>b.classList.remove('on'));if(el)el.classList.add('on');
  S._bgImg=null;S.bgP=null;S.bgVidIdx=-1;
  if(S._bgV){S._bgV.pause();if(S._bgV.src)URL.revokeObjectURL(S._bgV.src);S._bgV=null;}
  const vl=document.createElement('video');
  vl.src=url;vl.loop=true;vl.muted=true;vl.playsInline=true;vl.crossOrigin='anonymous';vl.preload='auto';
  vl.oncanplay=()=>{S._bgV=vl;vl.playbackRate=S.bgVidSpd;vl.play().catch(()=>{});startL();draw();};
  vl.onerror=()=>{S._bgV=null;};
  vl.load();
};

window.setTrans=(t,btn)=>{S.transStyle=t;document.querySelectorAll('.fp:last-of-type .fb:not([onclick*=\"setFmt\"]):not([onclick*=\"setFps\"])').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');draw();};
window.setFps=(f,btn)=>{S.fps=f;[...document.querySelectorAll('.fb')].filter(b=>b.textContent.includes('fps')).forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');};
window.setFmt=(f,btn)=>{S.fmt=f;document.querySelectorAll('.fp .fb').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');resizeCV();draw();};
window.onCh=()=>{
  const g=id=>document.getElementById(id);
  S.arSz=parseInt(g('arZ')?.value)||S.arSz;if(g('arZV'))g('arZV').textContent=S.arSz;
  S.arFn=g('arF')?.value||S.arFn;
  S.arWt=g('arW')?.value||S.arWt;
  S.trans=g('trT')?.checked??S.trans;
  S.trSz=parseInt(g('trZ')?.value)||S.trSz;if(g('trZV'))g('trZV').textContent=S.trSz;
  S.trFn=g('trF')?.value||S.trFn;
  S.trWt=g('trW')?.value||S.trWt;
  if(g('trU'))g('trU').style.display=S.trans?'block':'none';
  S.showNum=g('shNum')?.checked??S.showNum;
  const tc=g('tc')?.value;if(tc){S.tc=tc;if(g('tcH'))g('tcH').value=tc;}
  S.veil=parseFloat(g('vl')?.value)||S.veil;if(g('vlV'))g('vlV').textContent=S.veil.toFixed(2);
  S.vPos=parseInt(g('vPos')?.value)||50;if(g('vPosV'))g('vPosV').textContent=S.vPos+'%';
  S.lh=parseFloat(g('lhR')?.value)||1.5;if(g('lhV'))g('lhV').textContent=S.lh.toFixed(2);
  S.wm=g('wm')?.value||S.wm;
  S.wmPos=g('wmP')?.value||'br';
  S.shad=g('shTg')?.checked??S.shad;
  S.shadB=parseInt(g('shBlur')?.value)||20;if(g('shBV'))g('shBV').textContent=S.shadB;
  S.shadY=parseFloat(g('shY')?.value)||2;if(g('shYV'))g('shYV').textContent=S.shadY;
  S.stroke=g('strTg')?.checked??S.stroke;
  S.bgSpeed=parseFloat(g('bgSpd')?.value)||1;if(g('bgSpdV'))g('bgSpdV').textContent=S.bgSpeed.toFixed(1)+'x';
  S.bgVidSpd=parseFloat(g('vidSpd')?.value)||1;if(g('vidSpdV'))g('vidSpdV').textContent=S.bgVidSpd.toFixed(2)+'x';
  if(S._bgV&&S._bgV.playbackRate!==S.bgVidSpd)try{S._bgV.playbackRate=S.bgVidSpd;}catch(e){}
  S.parallax=g('parTg')?.checked??S.parallax;
  S.bgZoom=parseInt(g('bgZoom')?.value)||0;if(g('bgZoomV'))g('bgZoomV').textContent=S.bgZoom;
  S.vignette=parseFloat(g('vignetteR')?.value)||0;if(g('vignetteV'))g('vignetteV').textContent=S.vignette.toFixed(2);
  const colorOvOn=g('colorOvTg')?.checked??false;const colorOvHex=g('colorOv')?.value||'';
  if(colorOvOn&&colorOvHex){S.colorOv=colorOvHex;S.colorOvOp=parseFloat(g('colorOvOpR')?.value)||0.3;if(g('colorOvT'))g('colorOvT').value=colorOvHex;if(g('colorOvU'))g('colorOvU').style.display='block';}else{S.colorOv='';if(g('colorOvU'))g('colorOvU').style.display='none';}
  if(g('colorOvOpV'))g('colorOvOpV').textContent=S.colorOvOp.toFixed(2);
  S.bgBlur=parseFloat(g('bgBlurR')?.value)||0;if(g('bgBlurV'))g('bgBlurV').textContent=S.bgBlur+'px';
  S.fadeDur=parseFloat(g('fadeDur')?.value)||0.4;if(g('fadeDurV'))g('fadeDurV').textContent=S.fadeDur.toFixed(2);
  // Shadow UI
  if(g('shU'))g('shU').style.display=S.shad?'block':'none';
  const rec=g('rc')?.value;
  if(rec&&rec!==S.rec){S.rec=rec;if(S.surah&&S.sel.size>0){const f=FOLDERS[rec];if(f){const ix=[...S.sel].sort((a,b)=>a-b);S.urls=ix.map(i=>`https://everyayah.com/data/${f}/${String(S.surah[0]).padStart(3,'0')}${String(S.va[i].numberInSurah).padStart(3,'0')}.mp3`);}}if(S.playing){S.playing=false;S._audio.pause();$('ppBtn').innerHTML='&#9654; Preview';}}
  draw();
};

// ═══ VIEWS ═════════════════════════════════════
function showView(v){
  document.querySelectorAll('.v').forEach(el=>el.classList.remove('a'));
  $(v).classList.add('a');
  S.view=v;
  if(v!=='vs'){S.playing=false;S._audio.pause();stopL();$('ppBtn').innerHTML='&#9654; Preview';}
  if(v==='vs'){resizeCV();draw();renderCtrl();}
}
window.showView=showView;

// ═══ INIT ═══════════════════════════════════════
renderHome();
// Keep canvas animation alive when video bg active
setInterval(()=>{if(S.view==='vs'&&S._bgV&&S._bgV.readyState>=2&&!S._raf&&!S._bgV.paused)startL();},300);
</script>
