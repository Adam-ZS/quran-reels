<style>

.pop{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.pc{flex-shrink:0;background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--bd);border-radius:var(--rs);padding:10px 16px;cursor:pointer;transition:.2s;white-space:nowrap}
.pc:hover{border-color:var(--gd)}

.pc .en{font-size:11px;color:var(--tx);margin-top:1px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;padding:8px 32px 40px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center}
.sc:hover{border-color:var(--gd);background:var(--s2)}

.vh{padding:12px 32px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd);flex-shrink:0}

.vh .vi{flex:1}
.vh .vi .ar{font-family:'Scheherazade New',serif;font-size:22px;color:var(--gd)}
.vh .vi .en{font-size:12px;color:var(--td)}
.va{display:flex;gap:6px;flex-wrap:wrap}

.pe{background:var(--em);color:#0a0a0a}

.sc2{width:360px;min-width:360px;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}

.cb{flex:1;overflow-y:auto;padding:12px 16px}
.cg{margin-bottom:14px}

.exo p{color:var(--td);font-size:13px;text-align:center;max-width:340px}
.exp{width:240px;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.expb{height:100%;background:var(--gd);border-radius:2px;width:0%;transition:width .3s}
@keyframes sp{to{transform:rotate(360deg)}}

  .sc2{width:100%;min-width:0}.sl{flex-direction:column}

}

  S._audio.oncanplaythrough=()=>{go();S._audio.oncanplaythrough=null;};
  S._audio.onended=()=>{if(S.playing)setTimeout(()=>playV(idx+1),50);};
  setTimeout(()=>{if(S.playing&&S.vIdx===idx){go();S._audio.oncanplaythrough=null;}},2000);
}
// ═══ EXPORT (MediaRecorder + AudioContext) ═════
window.doExport=async()=>{
  if(S.exporting||S.urls.length<1)return;
  S.exporting=true;S.playing=false;S._audio.pause();
  $('exo').classList.add('on');$('ppBtn').disabled=true;$('peBtn').disabled=true;
  const pbar=$('expb'),pt=$('expP'),tt=$('expT');
  const idx=[...S.sel].sort((a,b)=>a-b),total=idx.length;
  try{
    // Step 1: preload audio buffers
    tt.textContent='Loading audio...';pt.textContent='0/'+total;pbar.style.width='5%';
    const actx=new AudioContext();if(actx.state==='suspended')await actx.resume();
    const bufs=[];
    for(let i=0;i<total;i++){
      try{
        const r=await fetch(S.urls[i]);if(!r.ok)throw new Error('HTTP'+r.status);
        const ab=await r.arrayBuffer();const buf=await actx.decodeAudioData(ab);bufs.push(buf);
      }catch(e){console.warn('audio fail',i,e);bufs.push(null);}
      pt.textContent=`Audio ${i+1}/${total}`;pbar.style.width=`${10+(i/total)*20}%`;
    }
    // Step 2: render and record — timed to actual audio durations
    tt.textContent='Recording...';pt.textContent='Rendering frames...';
    pbar.style.width='35%';
    const fade=0.4;
    // Calculate cumulative start times from actual audio durations
    const cum=[0];for(let i=0;i<total;i++)cum.push(cum[i]+(bufs[i]?.duration||2.5));
    const totalTime=cum[total]+1.5;
    const vidStream=CV.captureStream(30);
    const audDest=actx.createMediaStreamDestination();
    const mix=new MediaStream([...vidStream.getVideoTracks(),...audDest.stream.getAudioTracks()]);
    const mime='video/webm;codecs=vp9,opus';
    const rec=new MediaRecorder(mix,{mimeType:MediaRecorder.isTypeSupported(mime)?mime:'video/webm'});
    const chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
    // Show estimated time in the status
    pt.textContent=`Recording ~${Math.round(totalTime)}s ...`;
    rec.start();
    const baseTime=actx.currentTime+0.3;
    // Schedule audio + verse changes at actual durations
    for(let i=0;i<total;i++){
      const t=cum[i]; // start time of this verse
      if(bufs[i]){
        const src=actx.createBufferSource();src.buffer=bufs[i];src.connect(audDest);src.start(baseTime+t);
      }
      // Fade in the verse (from previous to current)
      if(i>0){
        const fadeStart=(t-fade)*1000;
        setTimeout(()=>{
          const st=performance.now(),dur=fade*1000;
          function fLoop(){
            const p=Math.min((performance.now()-st)/dur,1);
            const w=CV.width,h=CV.height;
            if(S._bgV&&S._bgV.readyState>=2)try{CT.drawImage(S._bgV,0,0,w,h);}catch(e){}
            else if(S._bgImg)try{CT.drawImage(S._bgImg,0,0,w,h);}catch(e){}
            else if(S.bgP)drawBg(w,h);else{CT.fillStyle='#0a0a0a';CT.fillRect(0,0,w,h);}
            CT.fillStyle=`rgba(0,0,0,${S.veil})`;CT.fillRect(0,0,w,h);
            S.vIdx=i-1;const va=getVerse();if(va)drawVerseText(va,w,h,1-p);
            S.vIdx=i;const vb=getVerse();if(vb)drawVerseText(vb,w,h,p);
            p<1?requestAnimationFrame(fLoop):draw();
          }
          fLoop();
        },fadeStart);
      }
      setTimeout(()=>{S.vIdx=i;draw();pt.textContent=`Verse ${i+1}/${total} @ ${Math.round(t)}s`;pbar.style.width=`${35+((i+1)/total)*50}%`;},t*1000);
    }
    // Stop after total time
    await new Promise(r=>setTimeout(r,totalTime*1000));
    rec.stop();actx.close();
    // Wait for final chunk
    await new Promise(r=>setTimeout(r,500));
    pbar.style.width='95%';pt.textContent='Finalizing...';
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`quran-${S.surah?.en?.replace(/[^a-z]/gi,'-')||'recitation'}-${S.fmt}.webm`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    pbar.style.width='100%';pt.textContent='Done! Downloading...';
    await new Promise(r=>setTimeout(r,1500));
  }catch(e){
    console.error('Export error:',e);
    pt.textContent='Error: '+e.message;tt.textContent='Export failed';
    await new Promise(r=>setTimeout(r,3000));
  }
  S.exporting=false;$('exo').classList.remove('on');$('ppBtn').disabled=false;$('peBtn').disabled=false;
  if(!S._bgV)stopL();draw();
};
// ═══ CONTROLS ══════════════════════════════════
function renderCtrl(){
  $('cbody').innerHTML=`
<div class="cg"><label>Reciter</label><select id="rc" onchange="onCh()"></select></div>
<div class="cg"><label>Format</label><div class="fp">${['9:16','16:9','1:1','4:5'].map(f=>`<button class="fb${f==='9:16'?' on':''}" onclick="setFmt('${f}',this)">${f}</button>`).join('')}</div></div>
<div class="cg"><label>Arabic Font</label><select id="arF" onchange="onCh()"><option value="Scheherazade New">Scheherazade (Uthmani)</option><option value="Amiri">Amiri (Naskh)</option><option value="Aref Ruqaa">Aref Ruqaa</option><option value="Noto Naskh Arabic">Noto Naskh</option></select></div>
<div class="cg"><label>Arabic Size</label><div class="rg"><input type="range" id="arZ" min="24" max="90" value="${S.arSz}" oninput="onCh()"><span class="rv" id="arZV">${S.arSz}</span></div></div>
<div class="cg"><div class="tr2"><label>Translation</label><label class="tg"><input type="checkbox" id="trT" ${S.trans?'checked':''} onchange="onCh()"><span class="sl"></span></label></div><div id="trU"><div class="rg" style="margin-bottom:4px"><span style="font-size:10px;color:var(--td)">Size</span><input type="range" id="trZ" min="12" max="50" value="${S.trSz}" oninput="onCh()"><span class="rv" id="trZV">${S.trSz}</span></div><select id="trF" onchange="onCh()"><option value="Inter">Inter</option><option value="Cinzel">Cinzel</option><option value="Playfair Display">Playfair Display</option><option value="Lora">Lora</option></select></div></div>
<div class="cg"><label>Text Color</label><div class="cl"><input type="color" id="tc" value="${S.tc}" oninput="onCh()"><input type="text" id="tcH" value="${S.tc}" oninput="document.getElementById('tc').value=this.value;onCh()"></div></div>
<div class="cg"><label>Dark Veil</label><div class="rg"><input type="range" id="vl" min="0" max="1" step="0.05" value="${S.veil}" oninput="onCh()"><span class="rv" id="vlV">${S.veil.toFixed(2)}</span></div></div>
<div class="cg"><label>Watermark</label><input type="text" id="wm" value="${S.wm}" oninput="onCh()"></div>
<div class="cg"><label>Background</label><div class="bgt">${['Presets','Videos'].map((t,i)=>`<button class="bgb${i===0?' on':''}" onclick="swBg('${t.toLowerCase()}',this)">${t}</button>`).join('')}</div><div id="bgC"></div></div>
`;
  RECS.forEach(r=>{const o=document.createElement('option');o.value=r[0];o.textContent=r[1];$('rc').appendChild(o);$('rc').value=S.rec;});
  renderBg('presets');
}
function renderBg(t){
  const c=$('bgC');
  if(t==='presets'){
    c.innerHTML=`<div class="bgp">${PRESETS.map(p=>`<div class="bgi${p[0]===S.bgP?' on':''}" style="background:linear-gradient(135deg,${p[1]})" onclick="pickP('${p[0]}',this)"></div>`).join('')}</div>`;
  }else{
    c.innerHTML=`<input type="text" id="vq" placeholder="Search videos..." value="nature" style="width:100%;padding:5px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:10px;outline:none;margin-bottom:5px;font-family:inherit" onkeyup="if(event.key==='Enter')window.searchVid()"><div class="bgv" id="vg"></div>`;
    window.searchVid();
  }
}
window.swBg=(t,btn)=>{S.bgT=t;document.querySelectorAll('.bgb').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');renderBg(t);};
window.pickP=(id,el)=>{S.bgP=id;S._bgImg=null;if(S._bgV){S._bgV.pause();if(S._bgV.src)URL.revokeObjectURL(S._bgV.src);S._bgV=null;stopL();}document.querySelectorAll('.bgi').forEach(b=>b.classList.remove('on'));el.classList.add('on');draw();};
window.searchVid=()=>{
  const q=($('vq')?.value||'nature').toLowerCase();const g=$('vg');if(!g)return;
  const m=VIDS.filter(v=>v.n.toLowerCase().includes(q));
  const r=m.length>0?m:VIDS;
  g.innerHTML=r.map((v,i)=>{
    let h=0;for(let c=0;c<v.n.length;c++)h=(h*31+v.n.charCodeAt(c))%360;
    const c1=`hsl(${h},55%,18%)`,c2=`hsl(${(h+40)%360},50%,25%)`;
    return `<div class="bp${i===0?' on':''}" onclick="pickVid(${VIDS.indexOf(v)},this)" style="background:linear-gradient(135deg,${c1},${c2})"><span>${v.n}</span></div>`;
  }).join('');
  if(r.length>0)pickVid(VIDS.indexOf(r[0]),g.querySelector('.bp'));
};
window.pickVid=(idx,el)=>{
  document.querySelectorAll('.bp').forEach(b=>b.classList.remove('on'));if(el)el.classList.add('on');
  if(idx<0||idx>=VIDS.length)return;const v=VIDS[idx];S._bgImg=null;S.bgP=null;
  if(S._bgV){S._bgV.pause();if(S._bgV.src)URL.revokeObjectURL(S._bgV.src);S._bgV=null;}
  const vl=document.createElement('video');
  vl.src=v.u;vl.loop=true;vl.muted=true;vl.playsInline=true;vl.crossOrigin='anonymous';vl.preload='auto';
  vl.oncanplay=()=>{S._bgV=vl;vl.play().catch(()=>{});startL();draw();};
  vl.onerror=()=>{};
  vl.load();
};
window.onCh=()=>{
  const g=id=>document.getElementById(id);
  S.arSz=parseInt(g('arZ')?.value)||S.arSz;if(g('arZV'))g('arZV').textContent=S.arSz;
  S.arFn=g('arF')?.value||S.arFn;
  S.trans=g('trT')?.checked??S.trans;
  S.trSz=parseInt(g('trZ')?.value)||S.trSz;if(g('trZV'))g('trZV').textContent=S.trSz;
  S.trFn=g('trF')?.value||S.trFn;
  if(g('trU'))g('trU').style.display=S.trans?'block':'none';
  const tc=g('tc')?.value;if(tc){S.tc=tc;if(g('tcH'))g('tcH').value=tc;}
  S.veil=parseFloat(g('vl')?.value)||S.veil;if(g('vlV'))g('vlV').textContent=S.veil.toFixed(2);
  S.wm=g('wm')?.value||S.wm;
  const rec=g('rc')?.value;
  if(rec&&rec!==S.rec){S.rec=rec;if(S.surah&&S.sel.size>0){const f=FOLDERS[rec];if(f){const ix=[...S.sel].sort((a,b)=>a-b);S.urls=ix.map(i=>`https://everyayah.com/data/${f}/${String(S.surah.n).padStart(3,'0')}${String(S.va[i].numberInSurah).padStart(3,'0')}.mp3`);}}if(S.playing){S.playing=false;S._audio.pause();$('ppBtn').innerHTML='&#9654; Preview';}}
  draw();
};
window.setFmt=(f,btn)=>{S.fmt=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');resizeCV();draw();};
// ═══ VIEWS ═════════════════════════════════════
function showView(v){
  document.querySelectorAll('.v').forEach(el=>el.classList.remove('a'));
  $(v==='vh'?'vh':v==='vv'?'vv':'vs').classList.add('a');
  S.view=v;
  if(v!=='vs'){S.playing=false;S._audio.pause();stopL();$('ppBtn').innerHTML='&#9654; Preview';}
  if(v==='vs'){resizeCV();draw();renderCtrl();}
}
window.showView=showView;
// ═══ INIT ══════════════════════════════════════
renderHome();
setInterval(()=>{if(S.view==='vs'&&S._bgV&&S._bgV.readyState>=2&&!S._raf&&!S._bgV.paused)startL();},300);
</script>
